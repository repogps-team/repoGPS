version: '3.8'

# Override para desarrollo local - NO commitear a main
# Uso: docker-compose -f docker-compose.yml -f docker-compose.local.yml up --build

services:
  # ============================================
  # Microservicio Mantenedor (Directo sin build - usa código local)
  # ============================================
  ms-mantenedor:
    image: node:18-alpine
    container_name: ms-mantenedor
    working_dir: /app
    command: sh -c "npm install && node index.js"
    environment:
      - DB_USER=postgres
      - DB_HOST=db_mantenedor
      - DB_NAME=db_mantenedor
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - PORT=3001
    volumes:
      - ./backend/ms-mantenedor:/app
    networks:
      - app-network

  # ============================================
  # Microservicio Expedientes (Directo sin build - usa código local)
  # ============================================
  ms-expedientes:
    image: node:18-alpine
    container_name: ms-expedientes
    working_dir: /app
    command: sh -c "npm install && node index.js"
    environment:
      - DB_USER=postgres
      - DB_HOST=db_expedientes
      - DB_NAME=db_expedientes
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - PORT=3002
      - MS_MANTENEDOR_URL=http://ms-mantenedor:3001
    volumes:
      - ./backend/ms-expedientes:/app
    networks:
      - app-network

  # ============================================
  # Microservicio Usuarios (Directo sin build - usa código local)
  # ============================================
  ms-usuarios:
    image: node:18-alpine
    container_name: ms-usuarios
    working_dir: /app
    command: sh -c "npm install && node index.js"
    environment:
      - NODE_OPTIONS=--max-old-space-size=256
      - DB_USER=postgres
      - DB_HOST=db
      - DB_NAME=db_usuarios
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - MS_MANTENEDOR_URL=http://ms-mantenedor:3001
      - MS_NOTIFICACIONES_URL=http://ms-notificaciones:3003
      - JWT_SECRET=repoGPS_jwt_secret_key_2026
    volumes:
      - ./backend/ms-usuarios:/app
    networks:
      - app-network

  # ============================================
  # MailHog (SMTP falso para desarrollo - captura emails en UI http://localhost:8025)
  # ============================================
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"   # UI web
      - "1025:1025"   # SMTP
    networks:
      - app-network

  # ============================================
  # Microservicio Notificaciones (Directo sin build - usa código local)
  # ============================================
  ms-notificaciones:
    image: node:18-alpine
    container_name: ms-notificaciones
    working_dir: /app
    command: sh -c "npm install && node index.js"
    environment:
      - PORT=3003
      - DB_USER=postgres
      - DB_HOST=db_notificaciones
      - DB_NAME=db_notificaciones
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_USER=
      - SMTP_FROM=noreply@repogps.local
      - FRONTEND_URL=http://localhost:8045
    volumes:
      - ./backend/ms-notificaciones:/app
    depends_on:
      - mailhog
    networks:
      - app-network

  # ============================================
  # Frontend (Build local desde repositorio)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-ui
    environment:
      # Usar ruta relativa para que funcione desde el navegador
      - VITE_API_URL=
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - app-network

  # ============================================
  # Nginx (Build local)
  # ============================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8045:8045"
    depends_on:
      - frontend
      - ms-usuarios
      - ms-mantenedor
      - ms-expedientes
      - ms-notificaciones
    networks:
      - app-network

networks:
  app-network:
    name: repogps_app-network
    external: true