global:
  resolve_timeout: 5m

route:
  receiver: discord-monitoring
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: discord-monitoring
      matchers:
        - severity = critical
      repeat_interval: 1m
      continue: true

receivers:
  - name: discord-monitoring
    discord_configs:
      - webhook_url: ${ALERTMANAGER_DISCORD_WEBHOOK_URL}
        title: '{{ template "discord.title" . }}'
        message: '{{ template "discord.message" . }}'

templates:
  - /etc/alertmanager/*.tmpl
