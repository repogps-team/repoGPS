version: '3.8'

services:
  # ============================================
  # Base de datos de Usuarios (existente)
  # ============================================
  db:
    image: postgres:15
    container_name: db_usuarios
    mem_limit: 256m
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_usuarios
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata_usuarios:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_usuarios"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  # ============================================
  # Base de datos del Mantenedor (NUEVA)
  # ============================================
  db_mantenedor:
    image: postgres:15
    container_name: db_mantenedor
    mem_limit: 256m
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_mantenedor
    volumes:
      - ./database/init_mantenedor.sql:/docker-entrypoint-initdb.d/init_mantenedor.sql
      - pgdata_mantenedor:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_mantenedor"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  # ============================================
  # Base de datos de Expedientes (NUEVA)
  # ============================================
  db_expedientes:
    image: postgres:15
    container_name: db_expedientes
    mem_limit: 256m
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_expedientes
    volumes:
      - ./database/init_expedientes.sql:/docker-entrypoint-initdb.d/init_expedientes.sql
      - pgdata_expedientes:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_expedientes"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  # ============================================
  # Base de datos de Auditoría (NUEVA)
  # ============================================
  db_auditoria:
    image: postgres:15
    container_name: db_auditoria
    mem_limit: 256m
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_auditoria
    volumes:
      - ./database/init_auditoria.sql:/docker-entrypoint-initdb.d/init_auditoria.sql
      - pgdata_auditoria:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_auditoria"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  # ============================================
  # Microservicio Usuarios
  # ============================================
  ms-usuarios:
    image: ghcr.io/repogps-team/repogps/repogps-ms-usuarios:${IMAGE_TAG:-latest}
    container_name: ms-usuarios
    mem_limit: 256m
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--max-old-space-size=256
      - DB_USER=postgres
      - DB_HOST=db
      - DB_NAME=db_usuarios
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - MS_MANTENEDOR_URL=http://ms-mantenedor:3001
    depends_on:
      - db
      - db_mantenedor
      - ms-mantenedor
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/metrics',res=>{process.exit(res.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # ============================================
  # Microservicio Mantenedor
  # ============================================
  ms-mantenedor:
    image: ghcr.io/repogps-team/repogps/repogps-ms-mantenedor:${IMAGE_TAG:-latest}
    container_name: ms-mantenedor
    mem_limit: 256m
    restart: unless-stopped
    environment:
      - DB_USER=postgres
      - DB_HOST=db_mantenedor
      - DB_NAME=db_mantenedor
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - PORT=3001
    depends_on:
      - db_mantenedor
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/metrics',res=>{process.exit(res.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # ============================================
  # GarageHQ Storage (S3-compatible)
  # ============================================
  garage-hq:
    image: dxflrs/garage:v2.3.0
    container_name: garage-hq
    mem_limit: 256m
    restart: unless-stopped
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=GKadmin01
      - GARAGE_DEFAULT_SECRET_KEY=changeme1234567890
      - GARAGE_DEFAULT_BUCKET=repogps-docs
      - GARAGE_LOG_LEVEL=info
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    networks:
      - app-network

  # ============================================
  # Microservicio Expedientes
  # ============================================
  ms-expedientes:
    image: ghcr.io/repogps-team/repogps/repogps-ms-expedientes:${IMAGE_TAG:-latest}
    container_name: ms-expedientes
    mem_limit: 256m
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      - DB_USER=postgres
      - DB_HOST=db_expedientes
      - DB_NAME=db_expedientes
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - PORT=3002
      - MS_MANTENEDOR_URL=http://ms-mantenedor:3001
      - GARAGE_ENDPOINT=http://garage-hq:3900
      - GARAGE_ACCESS_KEY=GKadmin01
      - GARAGE_SECRET_KEY=changeme1234567890
      - GARAGE_BUCKET=repogps-docs
    depends_on:
      - db_expedientes
      - ms-mantenedor
      - garage-hq
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3002/metrics',res=>{process.exit(res.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # ============================================
  # Microservicio Auditoría (NUEVO)
  # ============================================
  ms-auditoria:
    image: ghcr.io/repogps-team/repogps/repogps-ms-auditoria:${IMAGE_TAG:-latest}
    container_name: ms-auditoria
    mem_limit: 256m
    restart: unless-stopped
    expose:
      - "3004"
    environment:
      - DB_USER=postgres
      - DB_HOST=db_auditoria
      - DB_NAME=db_auditoria
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - PORT=3004
    depends_on:
      - db_auditoria
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3004/metrics',res=>{process.exit(res.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # ============================================
  # Frontend
  # ============================================
  frontend:
    image: ghcr.io/repogps-team/repogps/repogps-frontend:${IMAGE_TAG:-latest}
    container_name: frontend-ui
    mem_limit: 256m
    restart: unless-stopped
    environment:
      - VITE_API_USUARIOS_URL=http://nginx:80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # ============================================
  # Nginx (existente)
  # ============================================
  nginx:
    image: nginx:alpine
    mem_limit: 256m
    restart: unless-stopped
    ports:
      - "8045:8045"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - ms-usuarios
      - ms-mantenedor
      - ms-expedientes
      - ms-auditoria
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8045/nginx_status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  # ============================================
  # Monitoring (internal-only, sin puertos expuestos)
  # ============================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    mem_limit: 256m
    restart: unless-stopped
    environment:
      - ALERTMANAGER_DISCORD_WEBHOOK_URL=${ALERTMANAGER_DISCORD_WEBHOOK_URL}
    volumes:
      - ./prometheus/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./prometheus/alertmanager/discord.tmpl:/etc/alertmanager/discord.tmpl:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s|__DISCORD_WEBHOOK_URL__|${ALERTMANAGER_DISCORD_WEBHOOK_URL}|g" \
          /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && \
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.external-url=http://localhost:9093/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/alertmanager/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: repogps-prometheus
    mem_limit: 512m
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.external-url=/prometheus"
      - "--web.route-prefix=/prometheus"
    depends_on:
      - ms-usuarios
      - ms-mantenedor
      - ms-expedientes
      - node-exporter
      - postgres-exporter
      - postgres-exporter-mantenedor
      - postgres-exporter-expedientes
      - nginx-exporter
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/prometheus/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  grafana:
    image: grafana/grafana:10.4.5
    container_name: repogps-grafana
    mem_limit: 512m
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://pacheco.chillan.ubiobio.cl:8045/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_EXPLORE_ENABLED=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/custom-dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    mem_limit: 256m
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - app-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    mem_limit: 256m
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:password123@db:5432/db_usuarios?sslmode=disable
    depends_on:
      - db
    networks:
      - app-network

  postgres-exporter-mantenedor:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-mantenedor
    mem_limit: 256m
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:password123@db_mantenedor:5432/db_mantenedor?sslmode=disable
    depends_on:
      - db_mantenedor
    networks:
      - app-network

  postgres-exporter-expedientes:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-expedientes
    mem_limit: 256m
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:password123@db_expedientes:5432/db_expedientes?sslmode=disable
    depends_on:
      - db_expedientes
    networks:
      - app-network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx-exporter
    mem_limit: 256m
    restart: unless-stopped
    command:
      - "-nginx.scrape-uri=http://nginx:8045/nginx_status"
    depends_on:
      - nginx
    networks:
      - app-network

  # ============================================
  # Blackbox Exporter (health checks HTTP reales)
  # ============================================
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - app-network

volumes:
  pgdata_usuarios:
  pgdata_mantenedor:
  pgdata_expedientes:
  pgdata_auditoria:
  prometheus-data:
  grafana-data:
  garage-data:

networks:
  app-network:
    driver: bridge
    
